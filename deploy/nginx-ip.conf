# Temporary IP-based Mini App endpoint for Telegram testing.
server {
    listen 80;
    server_name 31.56.180.231;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    server_name 31.56.180.231;

    ssl_certificate     /etc/letsencrypt/nizhniy-kontur-ip-current/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/nizhniy-kontur-ip-current/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        proxy_pass http://nizhniy-kontur:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
